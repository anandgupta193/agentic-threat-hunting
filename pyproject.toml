[project]
name = "agentic-threat-hunting"
version = "0.1.0"
description = "LLM threat-hunting query generator over CloudTrail logs, with a credit-limited FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "structlog>=24.1",
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API (opt-in: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["utils.py"]  # provided by the assignment; kept unchanged

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["app"]
