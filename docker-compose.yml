# Values come from .env (copy .env.example); every one has a default, so only the LLM key is required. Project name keeps containers/volumes isolated.
name: ${COMPOSE_PROJECT_NAME:-threat-hunt}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threat_hunt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-threat_hunt}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-threat_hunt_test}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - threat_hunt_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-time job: data/nineteenFeaturesDf.csv -> data/cloudtrail.duckdb (skips if the CSV hash is unchanged).
  data-prep:
    build: .
    env_file: .env
    command: ["python", "scripts/prepare_data.py"]
    volumes:
      - ./data:/app/data
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: ""
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      data-prep:
        condition: service_completed_successfully

volumes:
  threat_hunt_pgdata:
